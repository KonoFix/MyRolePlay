name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: HTML/CSS/JS syntax check
        run: |
          # Verifica JSON válido em launch.json
          node -e "JSON.parse(require('fs').readFileSync('.claude/launch.json'))" || true

          # Verifica que os JS carregam sem syntax errors
          for f in app.js data.js dm.js $(find shared map -name '*.js'); do
            node --check "$f" || (echo "Syntax error em $f" && exit 1)
          done

      - name: Supabase migrations em ordem
        run: |
          # Nomes de migration devem bater com YYYYMMDDHHMMSS_*.sql
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "Migration com nome inválido: $base" && exit 1
            fi
          done

      - name: Grep de secrets vazados
        run: |
          # Avisa se alguém commitou service_role key ou access token
          if grep -r "sbp_[a-zA-Z0-9]\{30,\}" --include='*.{js,html,md,sql,yml}' .; then
            echo "::error ::Access token Supabase (sbp_...) encontrado no código."
            exit 1
          fi
          if grep -r 'service_role' --include='*.{js,html}' .; then
            echo "::warning ::Mentions de 'service_role' em código client-side — verifique."
          fi

  deploy-preview:
    runs-on: ubuntu-latest
    needs: lint-and-check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Vercel preview (requer VERCEL_TOKEN secret quando conectar)
        run: echo "Deploy preview placeholder — ativar após conectar Vercel"
